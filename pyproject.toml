[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "citewise"
version = "0.1.0"
description = "A biomedical research agent that answers only with evidence it can cite"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langchain-anthropic>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-mcp-adapters>=0.3",
    "mcp>=1.20",
    "qdrant-client>=1.15",
    "fastembed>=0.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
tracing = ["langfuse>=3"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
citewise-mcp = "citewise.mcp_server:main"
citewise-ask = "citewise.cli:main"
citewise-eval = "citewise.eval.cli:main"
citewise-api = "citewise.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
citewise = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
