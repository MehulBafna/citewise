name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      limit:
        description: "PubMedQA questions to evaluate"
        default: "30"
      gate:
        description: "Quality gate, e.g. agent:0.60 (empty: no gate)"
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test (offline, no API key)
        run: pytest

  # Runs on demand: a small live evaluation with the real Claude API and PubMed.
  eval:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NCBI_EMAIL: ${{ vars.NCBI_EMAIL }}
      LIMIT: ${{ inputs.limit }}
      GATE: ${{ inputs.gate }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      - name: Evaluate
        run: |
          citewise-eval --download --limit "$LIMIT" --modes closed_book,agent ${GATE:+--gate "$GATE"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: results/
