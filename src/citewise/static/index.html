<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Citewise · biomedical research agent</title>
<style>
  :root { --ink:#1b1f24; --muted:#5f6b76; --line:#dde3e8; --bg:#f6f8fa; --accent:#1f5f8b;
          --yes:#1e7a46; --no:#a83232; --maybe:#9a6a00; --na:#5f6b76; }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); }
  main { max-width:820px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .lede { color:var(--muted); margin:0 0 20px; }
  form { display:flex; gap:8px; }
  textarea { flex:1; font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:8px; resize:vertical; min-height:52px; background:#fff; }
  button { font:inherit; padding:0 18px; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.55; cursor:wait; }
  .examples { margin:10px 0 24px; display:flex; flex-wrap:wrap; gap:6px; }
  .examples button { background:#fff; color:var(--accent); border:1px solid var(--line); padding:4px 10px; font-size:14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px 20px; margin-top:16px; }
  .verdict { display:inline-block; font-weight:600; font-size:13px; letter-spacing:.04em; text-transform:uppercase; padding:3px 10px; border-radius:99px; color:#fff; }
  .v-yes{background:var(--yes)} .v-no{background:var(--no)} .v-maybe{background:var(--maybe)}
  .v-not_applicable,.v-insufficient_evidence,.v-refused{background:var(--na)}
  .summary { font-size:18px; margin:12px 0 4px; }
  ul { padding-left:20px; margin:8px 0; } li { margin:6px 0; }
  .cite { font-size:13px; margin-left:4px; } .cite a { color:var(--accent); }
  .sources li { font-size:14px; } .sources a { color:var(--accent); }
  .meta { color:var(--muted); font-size:13px; }
  .note { font-size:14px; color:var(--maybe); }
  h2 { font-size:15px; margin:16px 0 4px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  .error { color:var(--no); }
</style>
</head>
<body>
<main>
  <h1>Citewise</h1>
  <p class="lede">Ask a biomedical research question. The agent searches PubMed, answers only from what it read, and checks every citation before showing it.</p>
  <form id="ask">
    <textarea id="q" maxlength="1000" placeholder="e.g. Does vitamin D supplementation reduce fracture risk in older adults?"></textarea>
    <button id="go" type="submit">Ask</button>
  </form>
  <div class="examples" id="examples"></div>
  <div id="out"></div>
</main>
<script>
const EXAMPLES = [
  "Does vitamin D supplementation reduce fracture risk in older adults?",
  "Is metformin associated with lower cancer incidence in type 2 diabetes?",
  "Does exercise training improve depressive symptoms in adults?",
];
const $ = (id) => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) k === "class" ? node.className = v : node.setAttribute(k, v);
  for (const kid of kids) node.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return node;
};
for (const text of EXAMPLES) {
  const b = el("button", { type: "button" }, text);
  b.onclick = () => { $("q").value = text; $("ask").requestSubmit(); };
  $("examples").append(b);
}
function render(data) {
  const card = el("div", { class: "card" });
  if (data.status === "refused") {
    card.append(el("span", { class: "verdict v-refused" }, "declined"), el("p", { class: "summary" }, data.refusal));
    return card;
  }
  const a = data.answer;
  card.append(el("span", { class: `verdict v-${a.verdict}` }, a.verdict.replace("_", " ")), el("p", { class: "summary" }, a.summary));
  if (a.claims.length) {
    card.append(el("h2", {}, "Claims"));
    const ul = el("ul");
    for (const c of a.claims) {
      const cites = el("span", { class: "cite" });
      c.pmids.forEach((p, i) => cites.append(i ? ", " : "[", el("a", { href: `https://pubmed.ncbi.nlm.nih.gov/${p}/`, target: "_blank", rel: "noopener" }, p)));
      if (c.pmids.length) cites.append("]");
      ul.append(el("li", {}, c.statement, cites));
    }
    card.append(ul);
  }
  if (data.sources.length) {
    card.append(el("h2", {}, "Sources"));
    const ul = el("ul", { class: "sources" });
    for (const s of data.sources) ul.append(el("li", {}, el("a", { href: s.url, target: "_blank", rel: "noopener" }, s.title), ` (${s.year ?? "n.d."}, ${s.journal})`));
    card.append(ul);
  }
  if (data.removed_claims.length) card.append(el("p", { class: "note" }, `${data.removed_claims.length} claim(s) failed verification and were removed.`));
  const t = data.trace;
  const cost = t.cost_usd != null ? ` · ~$${t.cost_usd.toFixed(4)}` : "";
  card.append(el("p", { class: "meta" }, `${(t.total_ms / 1000).toFixed(1)} s · ${t.total_tokens} tokens · ${t.tool_calls} tool calls${cost}`));
  card.append(el("p", { class: "meta" }, data.disclaimer));
  return card;
}
$("ask").addEventListener("submit", async (event) => {
  event.preventDefault();
  const question = $("q").value.trim();
  if (!question) return;
  $("go").disabled = true;
  $("out").replaceChildren(el("p", { class: "meta" }, "Searching PubMed and checking citations…"));
  try {
    const response = await fetch("/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question }) });
    const data = await response.json();
    $("out").replaceChildren(response.ok ? render(data) : el("p", { class: "error" }, data.detail || "Something went wrong."));
  } catch (err) {
    $("out").replaceChildren(el("p", { class: "error" }, "Could not reach the server."));
  } finally {
    $("go").disabled = false;
  }
});
</script>
</body>
</html>
